<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>منصة الشكاوى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Tajawal", sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        -webkit-tap-highlight-color: transparent;
      }
      .app-header {
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        border-bottom-left-radius: 2rem;
        border-bottom-right-radius: 2rem;
        padding-bottom: 4rem;
      }
      .glass-card {
        background: #ffffff;
        border-radius: 1.25rem;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }
      .form-input {
        border: 1.5px solid #e2e8f0;
        border-radius: 0.75rem;
        padding: 0.875rem 1rem;
        width: 100%;
        transition: all 0.2s ease;
        background-color: #fcfcfc;
      }
      .form-input:focus {
        outline: none;
        border-color: #3b82f6;
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
      }
      .btn-primary {
        background: linear-gradient(to right, #1e3a8a, #2563eb);
        color: white;
        padding: 1rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 700;
        width: 100%;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      }
    </style>
  </head>
  <body class="antialiased">
    <div
      id="loaderOverlay"
      class="fixed inset-0 bg-white/95 z-50 hidden flex-col items-center justify-center backdrop-blur-sm"
    >
      <div
        class="w-12 h-12 border-4 border-slate-100 border-t-blue-600 rounded-full animate-spin mb-4"
      ></div>
      <p id="loaderText" class="font-bold text-slate-700 text-lg">
        جاري المعالجة...
      </p>
    </div>
    <div
      id="toastContainer"
      class="fixed top-6 left-1/2 -translate-x-1/2 z-50 w-[90%] max-w-sm pointer-events-none flex flex-col gap-2"
    ></div>

    <header class="app-header text-white pt-10 px-6 text-center shadow-md">
      <h1 class="text-3xl font-extrabold mb-2 tracking-tight">
        النظام الموحد للشكاوى
      </h1>
      <p class="text-blue-100 font-medium text-sm opacity-90">
        بوابة التبليغ عن مشاكل البنية التحتية
      </p>
    </header>

    <main class="max-w-md mx-auto px-5 -mt-10 relative z-10 pb-12">
      <div id="formScreen" class="glass-card p-6 md:p-8">
        <div class="mb-6">
          <label class="block text-sm font-bold text-slate-700 mb-2"
            >رقم الهاتف</label
          >
          <div class="flex flex-row-reverse">
            <input
              id="phoneInput"
              type="tel"
              placeholder="59xxxxxxx"
              class="form-input rounded-l-xl rounded-r-none border-l-0 text-left dir-ltr focus:z-10"
              style="direction: ltr"
            />
            <select
              id="countryCode"
              class="form-input rounded-r-xl rounded-l-none w-auto bg-slate-50 text-slate-600 font-bold dir-ltr border-r border-y focus:z-10"
              style="direction: ltr"
            >
              <option value="+970">+970</option>
              <option value="+972">+972</option>
            </select>
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-bold text-slate-700 mb-2"
            >تصنيف المشكلة</label
          >
          <select id="problemType" class="form-input appearance-none bg-white">
            <option value="" disabled selected>اختر التصنيف...</option>
            <option value="طرق">تعبيد وتأهيل طرق</option>
            <option value="مياه">مياه وصرف صحي</option>
            <option value="نفايات">نظافة ونفايات</option>
            <option value="إنارة">إنارة الشوارع</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-bold text-slate-700 mb-2"
            >تفاصيل المشكلة</label
          >
          <textarea
            id="description"
            rows="3"
            placeholder="وصف المشكلة بوضوح..."
            class="form-input resize-none"
          ></textarea>
        </div>

        <div class="mb-6 p-5 bg-slate-50/50 border border-slate-100 rounded-xl">
          <label class="block text-sm font-bold text-slate-800 mb-3"
            >موقع المشكلة</label
          >
          <button
            id="gpsBtn"
            onclick="getLocation()"
            class="w-full bg-white border-2 border-blue-100 text-blue-600 hover:bg-blue-50 font-bold rounded-xl px-4 py-3 flex items-center justify-center gap-2 transition-all mb-3 shadow-sm"
          >
            <span id="gpsBtnText">تحديد موقعي الجغرافي</span>
          </button>
          <div
            id="locationDisplay"
            class="hidden text-sm text-emerald-600 font-bold text-center mb-3 bg-emerald-50 py-2 rounded-lg border border-emerald-100"
          ></div>
          <input
            id="manualLocationInput"
            type="text"
            placeholder="العنوان بالتفصيل..."
            class="form-input text-sm py-2.5"
          />
        </div>

        <div class="mb-8">
          <div class="flex justify-between items-end mb-2">
            <label class="block text-sm font-bold text-slate-700"
              >المرفقات</label
            >
          </div>
          <div class="relative">
            <input
              id="photoInput"
              type="file"
              accept="image/*"
              multiple
              onchange="handleFiles(event)"
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
            />
            <div
              class="w-full border-2 border-dashed border-slate-200 rounded-xl p-4 text-center bg-slate-50 hover:bg-slate-100 transition-colors"
            >
              <span class="text-sm font-bold text-blue-600"
                >إضافة صور (اختياري)</span
              >
            </div>
          </div>
          <div
            id="previewGrid"
            class="grid grid-cols-4 gap-3 mt-4 hidden"
          ></div>
        </div>

        <button
          id="submitBtn"
          onclick="submitComplaint()"
          class="btn-primary text-lg flex items-center justify-center gap-2"
        >
          إرسال البيانات
        </button>
      </div>

      <div
        id="successScreen"
        class="glass-card p-8 hidden flex-col items-center justify-center text-center"
      >
        <h2 class="text-2xl font-extrabold text-slate-800 mb-1">
          تم إرسال الطلب
        </h2>
        <p class="text-slate-500 font-medium mb-5">
          رمز المتابعة: <br /><span
            id="ticketDisplay"
            class="text-xl text-blue-600 font-extrabold dir-ltr inline-block mt-2 tracking-widest bg-blue-50 px-4 py-2 rounded-lg border border-blue-100"
          ></span>
        </p>
        <div class="w-full h-px bg-slate-100 my-4"></div>
        <p class="text-sm font-bold text-slate-600 mb-4">
          لمتابعة التطورات وتلقي التحديثات الآلية:
        </p>
        <a
          id="telegramLink"
          href="#"
          target="_blank"
          class="w-full bg-[#0088cc] text-white hover:bg-[#0077b3] px-6 py-3.5 rounded-xl font-bold flex items-center justify-center gap-3 transition-colors shadow-lg shadow-blue-500/30"
        >
          متابعة الطلب عبر تيليجرام
        </a>
        <button
          onclick="location.reload()"
          class="mt-6 text-slate-400 text-sm font-bold hover:text-slate-600 transition-colors"
        >
          تقديم طلب جديد
        </button>
      </div>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyA3cYiWTMJQY-15uR3MRlahNFltcwFoWeM",
        authDomain: "nablus-e8a6d.firebaseapp.com",
        projectId: "nablus-e8a6d",
        storageBucket: "nablus-e8a6d.firebasestorage.app",
        messagingSenderId: "910333293460",
        appId: "1:910333293460:web:4e06dbd84dba39c078d581",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const IMGBB_KEY = "b33aa37db420efccaaed4067e2b41b20";
      const BOT_USERNAME = "shakaweebot";

      let userLocation = null;
      let selectedFiles = [];

      window.getLocation = function () {
        const btn = document.getElementById("gpsBtn");
        const text = document.getElementById("gpsBtnText");
        const display = document.getElementById("locationDisplay");
        text.textContent = "جاري التحديد...";
        btn.disabled = true;

        if (!navigator.geolocation) {
          showToast("المتصفح لا يدعم التحديد", "error");
          resetGpsBtn();
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLocation = {
              lat: pos.coords.latitude.toFixed(6),
              lng: pos.coords.longitude.toFixed(6),
            };
            display.textContent = "تم التحديد بنجاح";
            display.classList.remove("hidden");
            text.textContent = "تم التحديد";
            btn.classList.replace("border-blue-100", "border-emerald-200");
            btn.classList.replace("text-blue-600", "text-emerald-600");
            btn.disabled = false;
          },
          () => {
            showToast("تعذّر تحديد الموقع", "error");
            resetGpsBtn();
          },
          { enableHighAccuracy: true, timeout: 10000 },
        );
      };

      function resetGpsBtn() {
        const btn = document.getElementById("gpsBtn");
        document.getElementById("gpsBtnText").textContent =
          "تحديد موقعي الجغرافي";
        btn.classList.remove("border-emerald-200", "text-emerald-600");
        btn.classList.add("border-blue-100", "text-blue-600");
        btn.disabled = false;
      }

      window.handleFiles = function (event) {
        const files = Array.from(event.target.files);
        if (selectedFiles.length + files.length > 4) {
          showToast("الحد الأقصى 4 صور", "warning");
          return;
        }
        selectedFiles = [...selectedFiles, ...files].slice(0, 4);
        renderPreviews();
      };

      window.removeFile = function (index) {
        selectedFiles.splice(index, 1);
        document.getElementById("photoInput").value = "";
        renderPreviews();
      };

      function renderPreviews() {
        const grid = document.getElementById("previewGrid");
        if (selectedFiles.length === 0) {
          grid.classList.add("hidden");
          return;
        }
        grid.classList.remove("hidden");
        grid.innerHTML = selectedFiles
          .map((file, i) => {
            const url = URL.createObjectURL(file);
            return `<div class="relative rounded-lg overflow-hidden border border-slate-200 aspect-square shadow-sm">
                  <img src="${url}" class="w-full h-full object-cover" />
                  <button onclick="removeFile(${i})" class="absolute top-1 right-1 bg-white/90 text-red-500 rounded-full w-6 h-6 flex items-center justify-center text-xs shadow backdrop-blur-sm">✕</button>
                </div>`;
          })
          .join("");
      }

      async function compressImage(file) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const MAX_SIZE = 1000;
              let width = img.width;
              let height = img.height;
              if (width > height && width > MAX_SIZE) {
                height *= MAX_SIZE / width;
                width = MAX_SIZE;
              } else if (height > MAX_SIZE) {
                width *= MAX_SIZE / height;
                height = MAX_SIZE;
              }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);
              canvas.toBlob(
                (blob) =>
                  resolve(new File([blob], file.name, { type: "image/jpeg" })),
                "image/jpeg",
                0.7,
              );
            };
          };
        });
      }

      async function uploadToImgBB(file) {
        const formData = new FormData();
        formData.append("image", file);
        const res = await fetch(
          `https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`,
          { method: "POST", body: formData },
        );
        const data = await res.json();
        if (!data.success) throw new Error("فشل الرفع");
        return data.data.url;
      }

      window.submitComplaint = async function () {
        const phoneNum = document.getElementById("phoneInput").value.trim();
        const type = document.getElementById("problemType").value;
        const desc = document.getElementById("description").value.trim();
        const manualLoc = document
          .getElementById("manualLocationInput")
          .value.trim();

        if (!phoneNum || !type) {
          showToast("يرجى تعبئة الحقول الأساسية", "warning");
          return;
        }
        if (!userLocation && !manualLoc) {
          showToast("يرجى تحديد الموقع", "warning");
          return;
        }

        const fullPhone =
          document.getElementById("countryCode").value + phoneNum;
        const uniqueString =
          Date.now().toString(36).toUpperCase() +
          Math.floor(Math.random() * 1000);
        const generatedTicketId = "NBL-" + uniqueString.slice(-6);

        try {
          if (selectedFiles.length > 0) showLoader("جاري معالجة المرفقات...");
          else showLoader("جاري حفظ البيانات...");

          const uploadedUrls = [];
          for (const file of selectedFiles) {
            const compressed = await compressImage(file);
            const url = await uploadToImgBB(compressed);
            uploadedUrls.push(url);
          }

          document.getElementById("loaderText").textContent =
            "جاري الاعتماد...";

          await setDoc(doc(db, "complaints", generatedTicketId), {
            phone: fullPhone,
            type: type,
            description: desc,
            location: {
              mapUrl: userLocation
                ? `https://maps.google.com/?q=${userLocation.lat},${userLocation.lng}`
                : null,
              manual: manualLoc,
            },
            imageUrl: uploadedUrls.join(","),
            status: "مستلمة وجديدة",
            ticketId: generatedTicketId,
            telegramChatId: null,
            createdAt: serverTimestamp(),
          });

          hideLoader();
          document.getElementById("formScreen").classList.add("hidden");
          document.getElementById("successScreen").classList.remove("hidden");
          document.getElementById("successScreen").classList.add("flex");

          document.getElementById("ticketDisplay").textContent =
            generatedTicketId;
          document.getElementById("telegramLink").href =
            `https://t.me/${BOT_USERNAME}?start=${generatedTicketId}`;
        } catch (err) {
          hideLoader();
          showToast("حدث خطأ أثناء الاتصال بالنظام", "error");
        }
      };

      function showLoader(text) {
        document.getElementById("loaderText").textContent = text;
        document.getElementById("loaderOverlay").style.display = "flex";
      }
      function hideLoader() {
        document.getElementById("loaderOverlay").style.display = "none";
      }
      window.showToast = function (message, type) {
        const colors = {
          success: "bg-emerald-600",
          error: "bg-red-500",
          warning: "bg-amber-500",
        };
        const toast = document.createElement("div");
        toast.className = `pointer-events-auto ${colors[type]} text-white rounded-xl px-4 py-3.5 shadow-lg text-sm font-bold text-center transform transition-all duration-300 translate-y-[-20px] opacity-0`;
        toast.textContent = message;
        document.getElementById("toastContainer").appendChild(toast);
        requestAnimationFrame(() =>
          toast.classList.remove("translate-y-[-20px]", "opacity-0"),
        );
        setTimeout(() => {
          toast.classList.add("opacity-0", "translate-y-[-20px]");
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      };
    </script>
  </body>
</html>
